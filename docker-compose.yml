services:
  auth:
    hostname: auth
    image: justdan777/facc-auth:0.0.1-SNAPSHOT
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - TOKEN_SIGNING_KEY=${TOKEN_SIGNING_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - YANDEX_LOGGING_ENABLED=${YANDEX_LOGGING_ENABLED:-false}
      - YANDEX_LOG_GROUP_ID=${YANDEX_LOG_GROUP_ID:-}
      - YANDEX_IAM_KEY=${YANDEX_IAM_KEY:-}
    restart: always

  controller:
    hostname: control
    image: justdan777/facc-control:0.0.1-SNAPSHOT
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - YANDEX_LOGGING_ENABLED=${YANDEX_LOGGING_ENABLED:-false}
      - YANDEX_LOG_GROUP_ID=${YANDEX_LOG_GROUP_ID:-}
      - YANDEX_IAM_KEY=${YANDEX_IAM_KEY:-}
      - YANDEX_MQTT_REGISTRY_ID=${YANDEX_MQTT_REGISTRY_ID:-}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY:-}
    restart: always

  front:
    hostname: front
    build: ./facc-front
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    image: justdan777/facc-front
    restart: always

  nginx:
    build:
      context: ./nginx
      args:
        - CONFIG=prod/
    image: justdan777/facc-nginx
    container_name: facc-nginx
    hostname: facc-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth
      - controller
      - front
    restart: on-failure
