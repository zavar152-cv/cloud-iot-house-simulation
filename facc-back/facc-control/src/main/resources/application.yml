server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
  servlet:
    context-path: /api/v1
springdoc:
  packages-to-scan: ru.itmo.zavar.controller
  api-docs:
    path: /api-docs
spring:
  sql:
    init:
      mode: always
  jpa:
    database: postgresql
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    properties:
      hibernate:
        show_sql: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:user_db}
    password: ${SPRING_DATASOURCE_PASSWORD:facc}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db-facc}
    driver-class-name: org.postgresql.Driver
  mvc:
    log-resolved-exception: true
logging:
  level:
    sql: off
status:
  enabled: "Enabled"
  disabled: "Disabled"
yandex:
  auth-key-file: ${YANDEX_AUTH_KEY_FILE:/authorized_key.json}
  logging:
    enable: ${YANDEX_LOGGING_ENABLED:false}
    host: ingester.logging.yandexcloud.net
    port: 443
    log-group-id: ${YANDEX_LOG_GROUP_ID:}
    iam-key: ${YANDEX_IAM_KEY:}
  mqtt:
    broker-url: ssl://mqtt.cloud.yandex.net:8883
    registry-id: ${YANDEX_MQTT_REGISTRY_ID:}
  speech-kit:
    api-key: ${YANDEX_SPEECHKIT_API_KEY:}
    tts:
      host: tts.api.cloud.yandex.net
      port: 443
    stt:
      host: stt.api.cloud.yandex.net
      port: 443
