server:
  port: 25565
  error:
    include-message: always
    include-stacktrace: never
  servlet:
    context-path: /api/v1
springdoc:
  packages-to-scan: ru.itmo.zavar.faccauth.controller
  paths-to-exclude: /profile/**, /roleEntities/**, /userEntities/**
  api-docs:
    path: /api-docs
spring:
  jpa:
    database: postgresql
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    properties:
      hibernate:
        show_sql: false
    hibernate:
      ddl-auto: update
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:user_db}
    password: ${SPRING_DATASOURCE_PASSWORD:facc}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db-facc}
    driver-class-name: org.postgresql.Driver
  mvc:
    log-resolved-exception: true
    servlet:
      load-on-startup: 1
token:
  expire: 1440
  signing:
    key: ${TOKEN_SIGNING_KEY}
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}
yandex:
  auth-key-file: ${YANDEX_AUTH_KEY_FILE:/authorized_key.json}
  logging:
    enable: ${YANDEX_LOGGING_ENABLED:false}
    host: ingester.logging.yandexcloud.net
    port: 443
    log-group-id: ${YANDEX_LOG_GROUP_ID:}
    iam-key: ${YANDEX_IAM_KEY:}
